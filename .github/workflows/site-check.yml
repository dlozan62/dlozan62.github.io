name: Validate and publish DineCheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Ruby and cached gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test the site validator
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check assets/js/site.js
      - name: Build Jekyll pages
        run: bundle exec jekyll build --strict_front_matter
      - name: Validate generated pages and links
        run: python3 scripts/check_site.py
      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked website
        id: deployment
        uses: actions/deploy-pages@v4
