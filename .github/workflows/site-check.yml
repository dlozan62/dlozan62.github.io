name: Check site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: bundle exec sass assets/css/style.css /tmp/site-check.css --no-source-map
      - run: python3 scripts/check_site.py
