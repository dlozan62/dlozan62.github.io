<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#041e42">
  <meta name="description" content="{{ page.description | default: site.description }}"><meta property="og:title" content="{{ page.title }} | {{ site.title }}"><meta property="og:description" content="{{ page.description | default: site.description }}"><meta property="og:type" content="website"><meta property="og:image" content="{{ '/assets/images/campus-dining-work-session.jpg' | absolute_url }}">
  <title>{{ page.title }} | {{ site.title }}</title><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"><script src="{{ '/assets/vendor/gsap.min.js' | relative_url }}" defer></script><script src="{{ '/assets/vendor/ScrollTrigger.min.js' | relative_url }}" defer></script><script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="College Dining Meal Plan Initiative home"><span class="brand__name">College Dining</span><span class="brand__descriptor">Meal Plan Initiative</span></a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About us</a><a href="{{ '/sprints/' | relative_url }}" {% if page.url contains '/sprints/' %}aria-current="page"{% endif %}>Sprints</a></nav>
  </header>
  <main id="main-content">{{ content }}</main>
  <footer class="site-footer"><p>College Dining Meal Plan Initiative</p><div><a href="{{ '/about/' | relative_url }}">Team</a><a href="{{ '/sprints/' | relative_url }}">Project work</a><a href="https://github.com/dlozan62/dlozan62.github.io">GitHub repository</a></div><p class="site-footer__meta">CS 4390/5388 Software Project Management. Living project website.</p></footer>
</body>
</html>
