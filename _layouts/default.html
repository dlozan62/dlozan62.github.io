<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#041e42">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">

    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    >
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }} | {{ site.title | escape }}">
    <meta
      property="og:description"
      content="{{ page.description | default: site.description | escape }}"
    >
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta
      property="og:image"
      content="{{ '/assets/images/campus-dining-work-session.jpg' | absolute_url }}"
    >

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <a
        class="brand"
        href="{{ '/' | relative_url }}"
        aria-label="Campus Dining Availability System home"
      >
        <span class="brand__name">Campus Dining</span>
        <span class="brand__descriptor">Availability System</span>
      </a>

      <button
        class="menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <ul>
          <li>
            <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
          </li>
          <li>
            <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About us</a>
          </li>
          <li>
            <a href="{{ '/sprints/' | relative_url }}" {% if page.url contains '/sprints/' %}aria-current="page"{% endif %}>Sprints</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p class="site-footer__brand">Campus Dining Availability System</p>
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <ul>
          <li><a href="{{ '/about/' | relative_url }}">Team</a></li>
          <li><a href="{{ '/sprints/' | relative_url }}">Project work</a></li>
          <li>
            <a href="https://github.com/dlozan62/dlozan62.github.io">GitHub repository</a>
          </li>
        </ul>
      </nav>
      <p class="site-footer__meta">
        CS 4390/5388 Software Project Management. Living project website.
      </p>
    </footer>
  </body>
</html>
